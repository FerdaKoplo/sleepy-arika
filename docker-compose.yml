version: "3.8"

services:
  mysql:
    image: mysql:latest
    container_name: arika-bench-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: arika-db
      MYSQL_USER: admin
      MYSQL_PASSWORD: password
    ports:
      - "3306:3306"
    volumes:
      - arika-db-data:/var/lib/mysql

volumes:
  arika-db-data:
